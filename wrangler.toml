# Cloudflare Worker + D1 签到同步服务
#
# 部署方式：
#   1. npx wrangler login
#   2. npx wrangler d1 create tournament-checkin
#   3. 将返回的 database_id 填入下方
#   4. npx wrangler deploy

name = "tournament-checkin-api"
main = "cf-worker/worker.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "tournament-checkin"
# 创建后填入真实的 database_id
# database_id = ""
